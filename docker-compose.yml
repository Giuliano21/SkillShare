services:
  mongo:
    image: mongo:8
    attach: false
    ports:
      - "27017:27017"
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" localhost:27017/test | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mongo-data:/data/db
  
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      CLIENT_URL: http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend:/usr/src/app
      - backend-node-modules:/usr/src/app/node_modules
    env_file: ./backend/.env

  frontend:
    build: ./frontend
    ports: 
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/usr/src/app
      - frontend-node-modules:/usr/src/app/node_modules
volumes:
  mongo-data:
  backend-node-modules:
  frontend-node-modules: